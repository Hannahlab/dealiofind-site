<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary SEO -->
  <title>Dealiofind</title>
  <meta name="description" content="Shop trendy products that make everyday life easier. Home essentials, kitchen & dining, wellness & decor. Free shipping on orders over R500. Pay with Visa, Mastercard, PayPal, EFT, or SnapScan. South Africa's curated online store." />
  <meta name="keywords" content="online store South Africa, home essentials, kitchen decor, wellness products, ceramic mugs, bamboo bath mat, organic bedding, curated living, shop online SA" />
  <meta name="author" content="Dealiofind" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://dealiofind.co.za/" />
  <meta property="og:title" content="Dealiofind – Curated Living, Unbeatable Discoveries" />
  <meta property="og:description" content="Shop trendy products that make everyday life easier. Home essentials, kitchen & dining, wellness & decor. South Africa's curated online store." />
  <meta property="og:image" content="/logo.svg" />
  <meta property="og:locale" content="en_ZA" />
  <meta property="og:site_name" content="Dealiofind" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Dealiofind – Curated Living, Unbeatable Discoveries" />
  <meta name="twitter:description" content="Shop trendy products that make everyday life easier. Home essentials, kitchen & dining, wellness & decor." />
  <meta name="twitter:image" content="/logo.svg" />

  <!-- Geo -->
  <meta name="geo.region" content="ZA" />
  <meta name="geo.placename" content="South Africa" />

  <!-- Canonical -->
  <link rel="canonical" href="https://dealiofind.co.za/" />

  <!-- Structured Data (JSON-LD) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Dealiofind",
    "url": "https://dealiofind.co.za/",
    "description": "Curated living, unbeatable discoveries. Shop trendy products that make everyday life easier.",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://dealiofind.co.za/catalog?search={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Dealiofind",
    "url": "https://dealiofind.co.za/",
    "logo": "/logo.svg",
    "description": "South Africa's curated online store for home essentials, kitchen & dining, and wellness products.",
    "address": {
      "@type": "PostalAddress",
      "addressCountry": "ZA"
    }
  }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
